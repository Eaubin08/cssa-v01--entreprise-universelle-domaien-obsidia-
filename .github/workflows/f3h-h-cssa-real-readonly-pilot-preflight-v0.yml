name: f3h-h-cssa-real-readonly-pilot-preflight-v0
on:
  push:
    branches:
      - feat/f3h-h-cssa-real-readonly-pilot-preflight-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cssa-readonly-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Verify CSSA real-source readiness without source activation
        run: >-
          python -m pytest
          tests/test_f3h_h_cssa_real_readonly_pilot_preflight_v0.py
          tests/test_f3h_g_cssa_real_source_onboarding_pilot_v0.py
          tests/test_f3h_f_cssa_operational_source_registry_v0.py
          tests/test_f3h_e_cssa_real_readonly_intake_router_v0.py
          -q
