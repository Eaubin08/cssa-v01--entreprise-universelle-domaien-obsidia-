name: f2-1-current-main-runtime-compat

on:
  push:
    branches:
      - feat/f2-1-main-runtime-compat-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CSSA V0.1 repo
        uses: actions/checkout@v4

      - name: Checkout frozen Obsidia current main
        uses: actions/checkout@v4
        with:
          repository: Eaubin08/obsidia-x108-proofs
          ref: 48f0c2fbcfe097c213b2783bc7b4d0fba78e6621
          path: upstream
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Run F1 F2 and direct current-main compatibility
        env:
          OBSIDIA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: >-
          python -m pytest
          tests/test_f1_universal_contract_v0.py
          tests/test_f2_universal_conformance_v0.py
          tests/test_f21_real_current_main_runtime.py
          -q
