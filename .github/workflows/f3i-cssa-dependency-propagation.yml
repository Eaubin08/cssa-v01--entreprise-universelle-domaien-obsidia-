name: f3i-cssa-dependency-propagation

on:
  push:
    branches:
      - feat/f3i-cssa-dependency-propagation-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CSSA V0.1 repo
        uses: actions/checkout@v4

      - name: Checkout frozen Obsidia F2.5 resolver seam
        uses: actions/checkout@v4
        with:
          repository: Eaubin08/obsidia-x108-proofs
          ref: feat/f2-5-portable-domain-resolver-seam-v0
          path: upstream
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Run F1 through F3I proof suite
        env:
          OBSIDIA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: >-
          python -m pytest
          tests/test_f1_universal_contract_v0.py
          tests/test_f2_universal_conformance_v0.py
          tests/test_f21_real_current_main_runtime.py
          tests/test_f22_portable_domain_registration_v0.py
          tests/test_f23_canonical_compatible_resolver_v0.py
          tests/test_f24_full_portable_runtime_cycle_v0.py
          tests/test_f25_first_class_runtime_seam_v0.py
          tests/test_f3a_cssa_public_admin_domain_v0.py
          tests/test_f3b_cssa_field_intake_kit_v0.py
          tests/test_f3c_cssa_simulated_field_v0.py
          tests/test_f3d_cssa_season_scale_audit_v0.py
          tests/test_f3e_cssa_full_season_simulator_v0.py
          tests/test_f3e_cssa_reporting_routing_v0.py
          tests/test_f3f_cssa_organizational_stress_v0.py
          tests/test_f3g_a_cssa_adversarial_sensitivity_v0.py
          tests/test_f3g_b_cssa_public_shadow_v0.py
          tests/test_f3g_c_cssa_public_anchored_envelope_v0.py
          tests/test_f3g_d_cssa_public_watch_drift_v0.py
          tests/test_f3h_cssa_one_year_failure_campaign_v0.py
          tests/test_f3i_cssa_dependency_propagation_v0.py
          -q

      - name: Generate dependency propagation artifacts
        run: python scripts/generate_cssa_dependency_campaign_v0.py

      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cssa-f3i-dependency-${{ github.run_id }}
          path: generated_dependency/
          if-no-files-found: error
