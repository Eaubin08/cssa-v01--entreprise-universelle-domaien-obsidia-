name: f2-5-first-class-runtime-seam

on:
  push:
    branches:
      - feat/f2-5-first-class-runtime-seam-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-seam-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CSSA V0.1 repo
        uses: actions/checkout@v4

      - name: Checkout Obsidia F2.5 resolver-seam candidate
        uses: actions/checkout@v4
        with:
          repository: Eaubin08/obsidia-x108-proofs
          ref: feat/f2-5-portable-domain-resolver-seam-v0
          path: upstream
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pytest

      - name: Run F1 through F2.5 cross-repo proof suite
        env:
          OBSIDIA_UPSTREAM_ROOT: ${{ github.workspace }}/upstream
        run: >-
          python -m pytest
          tests/test_f1_universal_contract_v0.py
          tests/test_f2_universal_conformance_v0.py
          tests/test_f21_real_current_main_runtime.py
          tests/test_f22_portable_domain_registration_v0.py
          tests/test_f23_canonical_compatible_resolver_v0.py
          tests/test_f24_full_portable_runtime_cycle_v0.py
          tests/test_f25_first_class_runtime_seam_v0.py
          -q
